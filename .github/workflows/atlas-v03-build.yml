name: Atlas v0.3 scoped build
on:
  push:
    branches: [chatgpt/atlas-v0.3]
    paths:
      - '.github/workflows/atlas-v03-build.yml'
      - 'evidence/atlas/build/refresh_v0_3.py'
permissions:
  contents: write
jobs:
  refresh:
    if: github.ref == 'refs/heads/chatgpt/atlas-v0.3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Finalize the pinned builder and build candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('evidence/atlas/build/refresh_v0_3.py')
          s=p.read_text()
          patches=[]
          old="    a.replace('# RTG STATE ATLAS v0.2', '# RTG STATE ATLAS v0.3', 'candidate edition')"
          new=old+"\n    a.replace('*END — RTG STATE ATLAS v0.2.', '*END — RTG STATE ATLAS v0.3.', 'matching footer edition')"
          patches.append((old,new))
          old="    n=line(NEW_RESULT+' ')"
          new="    check('edition-presentation', text.startswith('# RTG STATE ATLAS v0.3\\n') and text.rstrip().endswith('*END — RTG STATE ATLAS v0.3. Noncanonical; owner DSNs govern.*'))\n"+old
          patches.append((old,new))
          old="    return controls\n"
          new="    mutate('U14 mismatched footer', '*END — RTG STATE ATLAS v0.3.', '*END — RTG STATE ATLAS v0.2.', 'edition-presentation')\n"+old
          patches.append((old,new))
          for old,new in patches:
              if new not in s:
                  assert s.count(old)==1,old
                  s=s.replace(old,new)
          p.write_text(s)
          import hashlib
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='4e9ed2f826b291084a0aa8c3de243765e4f98f8308828ffe44ae046a83325efa'
          PY
          python3 -I evidence/atlas/build/refresh_v0_3.py
          git add atlas/RTG_STATE_ATLAS.md evidence/atlas/v0.3 evidence/atlas/build/refresh_v0_3.py records/atlas/ATLAS_V0_3_REVIEW_PACKET.md records/atlas/RTG_STATE_ATLAS_v0.3_RELEASE_RECORD.md
          if ! git diff --cached --quiet; then
            git -c user.name='RTG Atlas build' -c user.email='noreply@github.com' commit -m 'atlas v0.3: generated candidate and validation records [skip ci]'
            git push origin HEAD:refs/heads/chatgpt/atlas-v0.3
          fi
      - name: Package inspected inputs and generated outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/atlas-v03
          git archive --format=tar HEAD | gzip > /tmp/atlas-v03/repository.tar.gz
          git bundle create /tmp/atlas-v03/repository.bundle --all
          git rev-parse HEAD > /tmp/atlas-v03/commit.txt
          git show atlas-v0.2:atlas/RTG_STATE_ATLAS.md > /tmp/atlas-v03/atlas-v0.2.md
          git show recog-v0.3.23:dsn/RTG_RELATIONAL_RECOGNITION_DSN.md > /tmp/atlas-v03/recog-v0.3.23.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-v03-build
          path: /tmp/atlas-v03/
          retention-days: 7
