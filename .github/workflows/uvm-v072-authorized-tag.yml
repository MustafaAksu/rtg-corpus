name: UVM v0.7.2 authorized annotated tag
on:
  push:
    branches:
      - chatgpt/uvm-v072-annotated-tag-20261124
permissions:
  contents: write
jobs:
  publish-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact published merge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '085e567be4c522f4b7e62044e2755e3af9d7a9b0'
          fetch-depth: 0
      - name: Verify publication, preserve old tag, create only the authorized new tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '085e567be4c522f4b7e62044e2755e3af9d7a9b0'
          test "$(git rev-parse HEAD^2)" = 'f0f2574423a4725220f4cd12aa61e02fe4a70657'
          test "$(git rev-parse refs/tags/uvm-v0.7.1)" = '34de100a15bcc885fe172b9abf7af0c065987d82'
          git fetch --no-tags origin main
          git merge-base --is-ancestor '085e567be4c522f4b7e62044e2755e3af9d7a9b0' FETCH_HEAD
          printf '%s  %s\n' '2bd854dfd0168906159f8add900ad70c86782bc8d06b420614308959f807880f' 'dsn/RTG_OPEN_M_DSN.md' 'be15b7990458b08b970cfd1898c9303b931c83bdb01fc7ef2c7290515a9266c0' 'evidence/uvm/v0.7.2-candidate/publication_compaction_report.json' 'e0c28c769e9da9c87dbb0931e2eee4a65fb21d136b8c965a380061158d5f3622' 'evidence/uvm/v0.7.2-candidate/publication_size_report.json' | sha256sum --check
          test -z "$(git ls-remote --tags origin 'refs/tags/uvm-v0.7.2' 'refs/tags/uvm-v0.7.2^{}')"
          grep -F '2bd854dfd0168906159f8add900ad70c86782bc8d06b420614308959f807880f' BASELINE.md | grep -F '| UVM (OPEN-M) |' | grep -F 'uvm-v0.7.2'
          grep -F '2bd854dfd0168906159f8add900ad70c86782bc8d06b420614308959f807880f' 'records/uvm/UVM_v0_7_2_RELEASE_RECORD.md' >/dev/null
          work=$(mktemp -d)
          git show 4a916c2d7e09156828656a56a402466e98d509c1:dsn/RTG_OPEN_M_DSN.md > "$work/candidate.md"
          python3 -I evidence/uvm/scripts/publish_uvm_v0_7_2.py "$work/candidate.md" 'dsn/RTG_OPEN_M_DSN.md' evidence/uvm/v0.7.2-candidate/publication_transform.json --check
          python3 tools/pipes_index.py --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' tag -a 'uvm-v0.7.2' '085e567be4c522f4b7e62044e2755e3af9d7a9b0' -F - <<'TAG_MESSAGE'
          UVM v0.7.2 - adopted by the PI, 24 November 2026

          dsn/RTG_OPEN_M_DSN.md SHA-256 2bd854dfd0168906159f8add900ad70c86782bc8d06b420614308959f807880f
          Release record: records/uvm/UVM_v0_7_2_RELEASE_RECORD.md
          Predecessor: uvm-v0.7.1 (0a51644de0a15035797ab03945207cf319fd6d7514a04b8cae441d9d6e93f53e)
          TAG_MESSAGE
          test "$(git cat-file -t refs/tags/uvm-v0.7.2)" = tag
          test "$(git rev-parse 'uvm-v0.7.2^{commit}')" = '085e567be4c522f4b7e62044e2755e3af9d7a9b0'
          git push origin 'refs/tags/uvm-v0.7.2:refs/tags/uvm-v0.7.2'
          git ls-remote --tags origin 'refs/tags/uvm-v0.7.2' 'refs/tags/uvm-v0.7.2^{}'
          git cat-file -p 'refs/tags/uvm-v0.7.2'
          printf 'UVM_ANNOTATED_TAG_PUBLISHED\n'
