name: UVM post-tag final exact-head verification
on:
  push:
    branches:
      - chatgpt/uvm-post-tag-pipes-check-20261125
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 'c65fe099bff3883e33af36453ce6c70c1411f71d'
          fetch-depth: 0
          persist-credentials: false
      - name: Check exact PR head and preservation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'c65fe099bff3883e33af36453ce6c70c1411f71d'
          git diff --quiet 'c7b7a3c149832bf06f66f2b7b2d68da7faab9e7d' HEAD -- dsn/ BASELINE.md upload/ evidence/ tools/ records/uvm/UVM_v0_7_2_RELEASE_RECORD.md
          test "$(git rev-parse HEAD:dsn/RTG_OPEN_M_DSN.md)" = "$(git rev-parse uvm-v0.7.2:dsn/RTG_OPEN_M_DSN.md)"
          test "$(git rev-parse HEAD:records/uvm/UVM_v0_7_2_RELEASE_RECORD.md)" = "$(git rev-parse uvm-v0.7.2:records/uvm/UVM_v0_7_2_RELEASE_RECORD.md)"
          printf '%s  %s\n' '2bd854dfd0168906159f8add900ad70c86782bc8d06b420614308959f807880f' 'dsn/RTG_OPEN_M_DSN.md' | sha256sum --check
          python3 -I tools/pipes_index.py --check
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          def old(p):
              return subprocess.check_output(["git","show","c7b7a3c149832bf06f66f2b7b2d68da7faab9e7d:"+str(p)]).decode()
          def split(s):
              i=s.index("\n---\n",4)
              return dict(l.split(": ",1) if ": " in l else (l.rstrip(":"),"") for l in s[4:i].splitlines()),s[i+5:]
          incoming=list(Path("pipes/UVM").glob("202*.md"))
          assert len(incoming)==4
          for p in incoming:
              a,x=split(old(p))
              b,y=split(p.read_text())
              assert a["state"]=="open" and b["state"]=="closed"
              assert x==y
              assert all(a.get(k)==b.get(k) for k in set(a)|set(b) if k not in ("state","disposition"))
          p=Path("pipes/GEN/20261123-UVM-jperp-proposal-review.md")
          s=old(p)
          t=p.read_text()
          assert t.startswith(s.rstrip("\n")+"\n") and split(s)[0]==split(t)[0]
          new=sorted(Path("pipes").glob("*/20261125-UVM-*.md"))
          assert len(new)==10
          from collections import Counter
          assert Counter(split(p.read_text())[0]["kind"] for p in new)=={"notice":8,"request":2}
          assert all(split(p.read_text())[0]["state"]=="open" for p in new)
          assert not subprocess.check_output(["git","status","--porcelain"]).strip()
          print("PASS four receiver dispositions only; original bodies preserved")
          print("PASS GEN J_perp sender addendum only; receiver metadata unchanged")
          print("PASS eight notices and two requests; all open")
          print("PASS DSN, BASELINE, frozen release record, evidence and tools unchanged")
          PY
